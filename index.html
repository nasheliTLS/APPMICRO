<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Tabla Nutricional Perú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una columna tipo app, barra de búsqueda fija arriba; grilla de grupos -> lista -> ficha */
:root{
  --bg:#f3f4ee; --surface:#ffffff; --sunk:#e8eae1; --ink:#1d2419; --muted:#626b5c; --line:#d6d9cc;
  --accent:#e0a100; --accent-ink:#2a2000; --brand:#2f4a2a;
  --prot:#3a7d5c; --fat:#d08a1c; --carb:#5b72b8;
  --bs:62%; --bl:88%; --bt:28%;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1d231a; --sunk:#252c22; --ink:#e9ecdf; --muted:#9aa391; --line:#323a2d;
  --accent:#f2b928; --accent-ink:#231a00; --brand:#cfe3b8;
  --prot:#5fbf8f; --fat:#eaa640; --carb:#8ea3e6;
  --bs:35%; --bl:24%; --bt:82%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1d231a; --sunk:#252c22; --ink:#e9ecdf; --muted:#9aa391; --line:#323a2d;
  --accent:#f2b928; --accent-ink:#231a00; --brand:#cfe3b8;
  --prot:#5fbf8f; --fat:#eaa640; --carb:#8ea3e6;
  --bs:35%; --bl:24%; --bt:82%; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;color:var(--brand);background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.src{font-size:.75rem;color:var(--muted);text-align:right}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:14px 44px 14px 46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px hsl(43 100% 50% / .22)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:1.3rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.hint code{font-family:var(--mono);font-size:.78rem;background:var(--sunk);padding:1px 5px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.05rem;font-weight:600}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
/* group grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:118px;transition:transform .12s,border-color .12s}
.gcard:hover{border-color:var(--accent)}
.gcard:active{transform:scale(.98)}
.badge{font-family:var(--mono);font-weight:500;display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 8px;border-radius:11px;background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) 60% var(--bt));font-size:.95rem}
.ico{flex:none;display:inline-grid;place-items:center;width:52px;height:52px;border-radius:15px;background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) 55% var(--bt))}
.ico svg{width:58%;height:58%}
.ico.sm{width:34px;height:34px;border-radius:10px}
.ico.xs{width:24px;height:24px;border-radius:7px}
.gcard{position:relative}
.gcard .lt{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.gcard .ico{align-self:flex-start}
.gcard .nm{font-weight:600;line-height:1.25}
.gcard .ct{font-size:.8rem;color:var(--muted);margin-top:auto;font-variant-numeric:tabular-nums}
/* list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row .rc{display:flex;flex-direction:column;align-items:center;gap:3px}
.row .rc .code{font-size:.7rem}
.row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.code{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.row .n{min-width:0}
.row .n b{font-weight:500;display:block}
.row .n small{color:var(--muted);font-size:.78rem}
.row .k{font-variant-numeric:tabular-nums;text-align:right;font-size:.9rem;white-space:nowrap}
.row .k small{display:block;color:var(--muted);font-size:.72rem}
mark{background:hsl(43 100% 55% / .38);color:inherit;border-radius:3px;padding:0 1px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-size:.85rem}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.back{border:0;background:none;padding:6px 0;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.ghead{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.ghead h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.more{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
/* detail */
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:4px}
.dtop h1{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800;letter-spacing:-.015em;line-height:1.1}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{font-size:.8rem;border-radius:999px;padding:4px 10px;background:var(--sunk);border:0}
.chip.code{font-family:var(--mono);background:var(--accent);color:var(--accent-ink)}
.fav{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.fav.on{color:var(--accent);border-color:var(--accent)}
.portion{margin-top:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.portion label{font-size:.85rem;color:var(--muted);margin-right:4px}
.portion input{width:84px;font:inherit;font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.portion .pill{padding:6px 11px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.mt{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.mt .v{font-family:var(--display);font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mt .v small{font-family:var(--body);font-size:.75rem;font-weight:500;color:var(--muted);margin-left:2px}
.mt .l{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.mt .l i{width:8px;height:8px;border-radius:2px;display:inline-block}
.mt.kcal{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mt.kcal .l,.mt.kcal .v small{color:inherit;opacity:.7}
.dist{margin-top:10px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tr{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.tr:first-child{border-top:0}
.tr .lab{color:var(--muted);font-size:.9rem}
.tr .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.tr .val small{font-weight:400;color:var(--muted);margin-left:3px;font-size:.78rem}
.tr .val.na{color:var(--muted);font-weight:400}
.xr{padding:12px 14px;border-top:1px solid var(--line)}
.xr:first-child{border-top:0}
.xr .lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.xr .val{margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>div{min-width:0}
.foot{margin-top:28px;font-size:.78rem;color:var(--muted)}
/* comparar */
.acts{display:flex;gap:8px;flex:none}
.cbtn{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.88rem}
.cbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cbtn svg{width:18px;height:18px}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.tray .in{max-width:828px;margin:0 auto;display:flex;align-items:center;gap:10px}
.tray .stack{display:flex;flex:1;min-width:0;gap:6px;overflow:hidden}
.tray .stack>span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:.8rem;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.tray .go{flex:none;height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
.tray .x{flex:none;border:0;background:none;color:var(--muted);font-size:.85rem;padding:8px}
body.has-tray .wrap{padding-bottom:96px}
.pick{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pick button{border:0;background:none;color:inherit;text-decoration:underline;font-weight:500}
.cwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-top:14px}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:calc(112px + var(--n) * 118px);font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:10px 12px;border-top:1px solid var(--line);text-align:right;vertical-align:top}
.cmp thead th{border-top:0;vertical-align:top;text-align:left;font-weight:600}
.cmp th[scope=row]{text-align:left;font-weight:400;color:var(--muted);font-size:.86rem;position:sticky;left:0;background:var(--surface);z-index:1;width:112px}
.cmp tr.grp th{background:var(--sunk);color:var(--ink);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;text-align:left;padding:7px 12px}
.cmp .food{display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp .food b{font-weight:600;line-height:1.2;font-size:.9rem}
.cmp .food .fr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cmp .food .rm{border:0;background:var(--sunk);border-radius:8px;width:28px;height:28px;color:var(--muted)}
.cmp .food a,.cmp .food .open{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.cmp td .num{font-weight:600}
.cmp td small{color:var(--muted);font-weight:400;margin-left:2px;font-size:.75rem}
.cmp td .mb{height:4px;border-radius:2px;background:var(--sunk);margin-top:5px;overflow:hidden}
.cmp td .mb i{display:block;height:100%;background:var(--muted);opacity:.45}
.cmp td.top .num{color:var(--ink)}
.cmp td.top .mb i{background:var(--accent);opacity:1}
.cmp td.top{background:hsl(43 100% 50% / .10)}
.cmp td.na{color:var(--muted)}
.addc{margin-top:12px;width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--line);background:none;font-weight:600;color:var(--muted)}
@media (max-width:560px){.macros{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr;gap:0}.cbtn span{display:none}.cbtn{padding:0 12px}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>

function ico(l,sz=''){return `<span class="ico ${sz}" style="--h:${HUES[l]??90}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[l]||''}</svg></span>`}
const SCALE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M7 20h10M5 7h14"/><path d="m5 7-3 7a3 3 0 0 0 6 0Z"/><path d="m19 7-3 7a3 3 0 0 0 6 0Z"/></svg>';
let cmp=store.get('tnp_cmp',[]).filter(i=>i<ALL.length), picking=false;
function saveCmp(){store.set('tnp_cmp',cmp);tray()}
function tray(){const t=$('#tray'),on=cmp.length>0&&location.hash!=='#cmp';t.hidden=!on;document.body.classList.toggle('has-tray',on);
  $('#tstack').innerHTML=cmp.map(i=>`<span>${ico(G[ALL[i].g].l,'xs')}${esc(ALL[i].n)}</span>`).join('');$('#tgo').textContent=`Comparar (${cmp.length})`}
function toggleCmp(i){if(cmp.includes(i))cmp=cmp.filter(x=>x!==i);else{if(cmp.length>=4)cmp.shift();cmp.push(i)}saveCmp()}
function sub(it){return it.s?`Estrato ${esc(it.s)}`:esc(G[it.g].name)}
function hl(name,terms){let s=esc(name);if(!terms.length)return s;const n=norm(name);let marks=[];terms.forEach(t=>{let p=n.indexOf(t);if(p>=0)marks.push([p,p+t.length])});marks.sort((a,b)=>a[0]-b[0]);let out='',last=0;const raw=name;marks.forEach(([a,b])=>{if(a<last)return;out+=esc(raw.slice(last,a))+'<mark>'+esc(raw.slice(a,b))+'</mark>';last=b});return out+esc(raw.slice(last))}
function row(it,terms=[]){const u=it.u;return `<button class="row" data-i="${it.i}"><span class="rc">${ico(G[it.g].l,'sm')}<span class="code">${it.c}</span></span><span class="n"><b>${hl(it.n,terms)}</b><small>${sub(it)}</small></span><span class="k">${u.kcal!=null?fmt(u.kcal)+' kcal':'—'}<small>${u.prot!=null?fmt(u.prot)+' g prot.':''}</small></span></button>`}

/* search */
function search(raw){
  const s=norm(raw).trim(); if(!s)return[];
  const compact=s.replace(/[\s\-.]/g,'');
  const codeM=/^[a-z]{1,2}\d*$/.test(compact);
  const terms=s.split(/\s+/).filter(Boolean);
  const res=[];
  for(const it of ALL){
    let sc=0;
    if(codeM&&it.ck===compact)sc=1000;
    else if(codeM&&/\d/.test(compact)&&it.ck.startsWith(compact))sc=500-it.ck.length;
    if(terms.every(t=>it.k.includes(t))){sc=Math.max(sc,(it.k.startsWith(terms[0])?300:(new RegExp('\\b'+terms[0]).test(it.k)?200:100))+(G[it.g].l==='SS'?0:20))}
    if(sc)res.push([sc,it]);
  }
  res.sort((a,b)=>b[0]-a[0]||a[1].n.localeCompare(b[1].n,'es'));
  return res.map(r=>r[1]);
}
function renderSearch(){
  const v=q.value; clr.hidden=!v;
  if(!v.trim()){route();return}
  const r=search(v), terms=norm(v).trim().split(/\s+/);
  view.innerHTML=(picking?`<div class="pick">Toca un alimento para agregarlo a la comparación<button id="pcancel">Cancelar</button></div>`:'')+`<div class="sec"><div class="sec-h"><h2>${r.length?r.length+' resultado'+(r.length>1?'s':''):'Sin resultados'}</h2><span class="eyebrow">Búsqueda</span></div>
  ${r.length?`<div class="list">${r.slice(0,limit).map(it=>row(it,terms)).join('')}</div>${r.length>limit?`<button class="more" id="more">Ver más (${r.length-limit})</button>`:''}`
  :`<div class="empty">No encontramos “${esc(v)}”. Prueba con otra palabra o un código como <b>A12</b> o <b>E5</b>.</div>`}</div>`;
  const m=$('#more'); if(m)m.onclick=()=>{limit+=100;renderSearch()};
  const pc=$('#pcancel'); if(pc)pc.onclick=()=>{picking=false;q.value='';clr.hidden=true;route()};
}
let t; q.addEventListener('input',()=>{limit=60;clearTimeout(t);t=setTimeout(renderSearch,90)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){q.blur()}});
clr.onclick=()=>{q.value='';clr.hidden=true;route();q.focus()};

/* views */
function home(){
  const fl=favs.map(i=>ALL[i]).filter(Boolean), rl=recent.map(i=>ALL[i]).filter(Boolean).slice(0,6);
  view.innerHTML=`
  ${fl.length?`<div class="sec"><div class="sec-h"><h2>Favoritos</h2><span class="eyebrow">${fl.length}</span></div><div class="list">${fl.map(it=>row(it)).join('')}</div></div>`:''}
  ${rl.length?`<div class="sec"><div class="sec-h"><h2>Vistos recientemente</h2></div><div class="list">${rl.map(it=>row(it)).join('')}</div></div>`:''}
  <div class="sec"><div class="sec-h"><h2>Grupos de alimentos</h2><span class="eyebrow">${ALL.length.toLocaleString('es-PE')} registros</span></div>
  <div class="grid">${G.map((g,gi)=>`<button class="gcard" data-g="${g.l}">${ico(g.l)}<span class="lt">${g.l}</span><span class="nm">${esc(g.name)}</span><span class="ct">${g.items.length} alimentos</span></button>`).join('')}</div></div>
  <p class="foot">Fuente: Tablas Peruanas de Composición de Alimentos (CENAN–INS, 2017) y columnas complementarias del archivo de origen. Los valores son referenciales.</p>`;
}
const SORTS={code:['Código',(a,b)=>a.i-b.i],name:['Nombre',(a,b)=>a.n.localeCompare(b.n,'es')],kcal:['Energía',null],prot:['Proteínas',null],fe:['Hierro',null],ca:['Calcio',null],fibra:['Fibra',null]};
function group(l){
  const g=G.find(x=>x.l===l); if(!g)return home();
  let items=[...g.items]; const s=SORTS[sortBy];
  items.sort(s[1]||((a,b)=>(b.u[sortBy]??-1)-(a.u[sortBy]??-1)));
  view.innerHTML=`<button class="back" data-back>‹ Grupos</button>
  <div class="ghead">${ico(g.l)}<div><h1>${esc(g.name)}</h1><div class="eyebrow">${g.items.length} alimentos · grupo ${g.l}</div></div></div>
  <div class="toolbar"><span class="eyebrow">Ordenar</span>${Object.entries(SORTS).map(([k,v])=>`<button class="pill ${k===sortBy?'on':''}" data-sort="${k}">${v[0]}</button>`).join('')}</div>
  <div class="list">${items.map(it=>{if(['code','name','kcal','prot'].includes(sortBy))return row(it);const u=it.u[sortBy],m=NUT[sortBy];return row(it).replace(/<span class="k">[\s\S]*?<\/small><\/span>/,`<span class="k">${u!=null?fmt(u)+' '+m[1]:'—'}<small>${m[0].toLowerCase()}</small></span>`)}).join('')}</div>`;
}
function val(it,k){const v=it.u[k];return v==null?null:v*grams/100}
function trow(it,k){const m=NUT[k],v=val(it,k);return `<div class="tr"><span class="lab">${m[0]}</span><span class="val ${v==null?'na':''}">${v==null?'—':fmt(v)+`<small>${m[1]}</small>`}</span></div>`}
function detail(i){
  const it=ALL[i]; if(!it)return home();
  recent=[i,...recent.filter(x=>x!==i)].slice(0,12); store.set('tnp_recent',recent);
  const g=G[it.g], u=it.u, isFav=favs.includes(i);
  const carbs=u.chod??u.cho, eP=(u.prot||0)*4,eF=(u.grasa||0)*9,eC=(carbs||0)*4,eT=eP+eF+eC;
  const pct=x=>eT?Math.round(x/eT*100):0;
  view.innerHTML=`<button class="back" data-back>‹ ${esc(g.name)}</button>
  <div class="dtop"><div style="min-width:0"><h1>${esc(it.n)}</h1>
  <div class="meta"><span class="chip code">${it.c}</span><button class="chip" data-g="${g.l}">${esc(g.name)}</button>${it.s?`<span class="chip">Estrato ${esc(it.s)}</span>`:''}</div></div>
  <div class="acts"><button class="cbtn ${cmp.includes(i)?'on':''}" id="cmpb" aria-label="Comparar">${SCALE}<span>${cmp.includes(i)?'En comparación':'Comparar'}</span></button>
  <button class="fav ${isFav?'on':''}" id="fav" aria-label="${isFav?'Quitar de favoritos':'Agregar a favoritos'}"><svg width="22" height="22" viewBox="0 0 24 24" fill="${isFav?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button></div></div>
  <div class="portion"><label for="g">Porción</label><input id="g" type="number" inputmode="decimal" min="1" value="${grams}"><span>g</span>${[50,100,150,200,250].map(x=>`<button class="pill ${x===grams?'on':''}" data-gr="${x}">${x} g</button>`).join('')}</div>
  <div id="dyn"></div>
  ${it.x.length?`<div class="sec"><div class="sec-h"><h2>Información adicional</h2></div><div class="tbl">${it.x.map(([l,v])=>`<div class="xr"><div class="lab">${esc(l)}</div><div class="val">${esc(v)}</div></div>`).join('')}</div></div>`:''}`;
  function dyn(){
    const mt=(cls,lab,k,unit,col)=>{const v=k==='carb'?(carbs==null?null:carbs*grams/100):val(it,k);return `<div class="mt ${cls}"><div class="l">${col?`<i style="background:var(${col})"></i>`:''}${lab}</div><div class="v">${v==null?'—':fmt(v)}<small>${v==null?'':unit}</small></div></div>`};
    $('#dyn').innerHTML=`<div class="macros">${mt('kcal','Energía','kcal','kcal')}${mt('','Proteínas','prot','g','--prot')}${mt('','Grasas','grasa','g','--fat')}${mt('',u.chod!=null?'Carbohidr. disp.':'Carbohidratos','carb','g','--carb')}</div>
    ${eT?`<div class="dist"><div class="bar" role="img" aria-label="Distribución de energía"><span style="width:${eP/eT*100}%;background:var(--prot)"></span><span style="width:${eF/eT*100}%;background:var(--fat)"></span><span style="width:${eC/eT*100}%;background:var(--carb)"></span></div>
    <div class="legend"><span>Energía de proteínas ${pct(eP)}%</span><span>grasas ${pct(eF)}%</span><span>carbohidratos ${pct(eC)}%</span></div></div>`:''}
    <div class="sec"><div class="sec-h"><h2>Composición</h2><span class="eyebrow">en ${fmt(grams)} g</span></div><div class="tbl">${['kj','agua','cho','chod','fibra','ceniza'].map(k=>trow(it,k)).join('')}</div></div>
    <div class="two"><div class="sec"><div class="sec-h"><h2>Minerales</h2></div><div class="tbl">${['ca','p','zn','fe','na','k'].map(k=>trow(it,k)).join('')}</div></div>
    <div class="sec"><div class="sec-h"><h2>Vitaminas</h2></div><div class="tbl">${['bcar','vita','tia','ribo','nia','vitc','fol'].map(k=>trow(it,k)).join('')}</div></div></div>`;
  }
  dyn();
  const gi=$('#g'); gi.addEventListener('input',()=>{const v=parseFloat(gi.value);if(v>0){grams=v;dyn();document.querySelectorAll('[data-gr]').forEach(b=>b.classList.toggle('on',+b.dataset.gr===grams))}});
  $('#fav').onclick=()=>{favs=favs.includes(i)?favs.filter(x=>x!==i):[i,...favs];store.set('tnp_favs',favs);detail(i)};
  $('#cmpb').onclick=()=>{toggleCmp(i);const on=cmp.includes(i),b=$('#cmpb');b.classList.toggle('on',on);b.querySelector('span').textContent=on?'En comparación':'Comparar'};
}
const CROWS=[['Energía y macronutrientes',['kcal','prot','grasa','chod','cho','fibra','agua']],['Minerales',['ca','p','zn','fe','na','k']],['Vitaminas',['bcar','vita','tia','ribo','nia','vitc','fol']]];
function compare(){
  const its=cmp.map(i=>ALL[i]);
  const pick=picking?`<div class="pick">Toca un alimento de la búsqueda para agregarlo<button id="pcancel">Cancelar</button></div>`:'';
  if(its.length<2){view.innerHTML=`<button class="back" data-back>‹ Inicio</button><div class="ghead">${'<span class="ico" style="--h:43">'+SCALE.replace('stroke-width="2"','stroke-width="1.7"')+'</span>'}<div><h1>Comparar alimentos</h1><div class="eyebrow">Hasta 4 a la vez</div></div></div>${pick}
    <div class="empty">${its.length?`Tienes <b>${esc(its[0].n)}</b>. Agrega al menos otro alimento.`:'Abre un alimento y toca <b>Comparar</b>, o agrégalos desde aquí.'}</div>
    ${its.length?`<div class="list" style="margin-top:12px">${its.map(it=>row(it)).join('')}</div>`:''}<button class="addc" id="addc">+ Agregar alimento</button>`;}
  else{
    const body=CROWS.map(([title,keys])=>`<tr class="grp"><th colspan="${its.length+1}">${title}</th></tr>`+keys.map(k=>{
      const vs=its.map(it=>val(it,k)), mx=Math.max(...vs.filter(v=>v!=null),0), cnt=vs.filter(v=>v!=null).length;
      if(!cnt)return '';
      const m=NUT[k];const lab=k==='chod'?'Carbohidr. disponibles':k==='cho'?'Carbohidr. totales':m[0];
      return `<tr><th scope="row">${lab} <small>(${m[1]})</small></th>${vs.map(v=>v==null?`<td class="na">—</td>`:`<td class="${cnt>1&&v===mx&&mx>0?'top':''}"><span class="num">${fmt(v)}</span><div class="mb"><i style="width:${mx?v/mx*100:0}%"></i></div></td>`).join('')}</tr>`}).join('')).join('');
    view.innerHTML=`<button class="back" data-back>‹ Inicio</button><div class="ghead">${'<span class="ico" style="--h:43">'+SCALE.replace('stroke-width="2"','stroke-width="1.7"')+'</span>'}<div><h1>Comparar alimentos</h1><div class="eyebrow">${its.length} alimentos · en ${fmt(grams)} g · resaltado el valor más alto</div></div></div>
    <div class="portion"><label for="g">Porción</label><input id="g" type="number" inputmode="decimal" min="1" value="${grams}"><span>g</span>${[50,100,150,200,250].map(x=>`<button class="pill ${x===grams?'on':''}" data-gr="${x}">${x} g</button>`).join('')}</div>${pick}
    <div class="cwrap"><table class="cmp" style="--n:${its.length}"><thead><tr><th scope="col" style="position:sticky;left:0;background:var(--surface);z-index:2"></th>${its.map(it=>`<th scope="col"><div class="food"><div class="fr">${ico(G[it.g].l,'sm')}<button class="rm" data-rm="${it.i}" aria-label="Quitar ${esc(it.n)}">×</button></div><button class="open" data-i="${it.i}"><b>${esc(it.n)}</b></button><span class="code">${it.c}${it.s?' · Estrato '+esc(it.s):''}</span></div></th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    ${its.length<4?'<button class="addc" id="addc">+ Agregar alimento</button>':''}`;
    const gi=$('#g'); gi.addEventListener('input',()=>{const v=parseFloat(gi.value);if(v>0){grams=v;const pos=gi.selectionStart;compare();const n=$('#g');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}});
  }
  const a=$('#addc'); if(a)a.onclick=()=>{picking=true;q.focus();compare()};
  const pc=$('#pcancel'); if(pc)pc.onclick=()=>{picking=false;compare()};
}
function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('g-'))group(h.slice(2));
  else if(h.startsWith('i-'))detail(+h.slice(2));
  else if(h==='cmp')compare();
  else home();
  tray();
}
function go(h){if(q.value){q.value='';clr.hidden=true}if(location.hash==='#'+h){route()}else location.hash=h;window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{if(location.hash!=='#cmp')picking=false;q.value='';clr.hidden=true;route();window.scrollTo(0,0)});
view.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.i!=null){const i=+b.dataset.i;if(picking&&q.value){picking=false;if(!cmp.includes(i))toggleCmp(i);q.value='';clr.hidden=true;if(location.hash==='#cmp')route();else go('cmp')}else go('i-'+i)}
  else if(b.dataset.rm!=null){toggleCmp(+b.dataset.rm);compare()}
  else if(b.dataset.g)go('g-'+b.dataset.g);
  else if(b.dataset.sort){sortBy=b.dataset.sort;group(location.hash.slice(3))}
  else if(b.dataset.gr){grams=+b.dataset.gr;if(location.hash==='#cmp')compare();else detail(+location.hash.slice(3))}
  else if(b.hasAttribute('data-back')){const h=location.hash;if(h.startsWith('#i-')){go('g-'+G[ALL[+h.slice(3)].g].l)}else go('')}
});
$('#tgo').onclick=()=>go('cmp');
$('#tclr').onclick=()=>{cmp=[];saveCmp()};
$('#home').onclick=()=>{q.value='';clr.hidden=true;go('')};
window.addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>4),{passive:true});
route();
})();
</script>
