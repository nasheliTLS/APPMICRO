name: Construir APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ordenar archivos
        run: |
          mkdir -p app/src/main/assets app/src/main/java/pe/tabla/nutricional app/src/main/res/values app/src/main/res/mipmap-xxxhdpi
          cp app.gradle app/build.gradle
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.java app/src/main/java/pe/tabla/nutricional/
          cp styles.xml app/src/main/res/values/
          cp ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
          cp index.html app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TablaNutricional-APK
          path: app/build/outputs/apk/debug/app-debug.apk
